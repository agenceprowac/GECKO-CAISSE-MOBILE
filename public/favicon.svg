<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Fond sombre arrondi (pour icône PWA sur fond sombre) -->
  <rect width="512" height="512" rx="100" fill="#111827"/>
  
  <!-- Corps du gecko (adapté en bleu #3B82F6) -->
  <!-- Queue formant le G -->
  <path d="M 155 310 
           C 105 310 75 280 75 240 
           C 75 175 125 140 175 140 
           C 215 140 240 165 240 195 
           L 200 195 
           C 200 185 190 172 175 172 
           C 140 172 107 198 107 240 
           C 107 262 123 278 155 278 
           L 155 250 L 215 250 L 215 310 Z" 
        fill="#3B82F6"/>
  
  <!-- Corps principal du gecko -->
  <ellipse cx="270" cy="195" rx="65" ry="35" fill="#3B82F6" transform="rotate(-20 270 195)"/>
  
  <!-- Tête -->
  <ellipse cx="355" cy="155" rx="38" ry="28" fill="#3B82F6" transform="rotate(-25 355 155)"/>
  
  <!-- Oeil -->
  <circle cx="368" cy="145" r="8" fill="white"/>
  <circle cx="370" cy="144" r="4" fill="#1E293B"/>
  
  <!-- Patte avant gauche -->
  <path d="M 245 185 C 220 170 205 150 195 135" stroke="#3B82F6" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="191" cy="128" r="6" fill="#3B82F6"/>
  <circle cx="200" cy="120" r="6" fill="#3B82F6"/>
  <circle cx="211" cy="127" r="6" fill="#3B82F6"/>
  
  <!-- Patte avant droite -->
  <path d="M 280 175 C 285 145 295 125 305 110" stroke="#3B82F6" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="300" cy="103" r="6" fill="#3B82F6"/>
  <circle cx="311" cy="98" r="6" fill="#3B82F6"/>
  <circle cx="320" cy="108" r="6" fill="#3B82F6"/>
  
  <!-- Patte arrière gauche -->
  <path d="M 230 215 C 205 225 185 240 170 260" stroke="#3B82F6" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="163" cy="266" r="6" fill="#3B82F6"/>
  <circle cx="172" cy="274" r="6" fill="#3B82F6"/>
  <circle cx="180" cy="265" r="6" fill="#3B82F6"/>
  
  <!-- Patte arrière droite -->
  <path d="M 270 225 C 265 255 265 275 270 295" stroke="#3B82F6" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="264" cy="302" r="6" fill="#3B82F6"/>
  <circle cx="274" cy="308" r="6" fill="#3B82F6"/>
  <circle cx="282" cy="299" r="6" fill="#3B82F6"/>
</svg>